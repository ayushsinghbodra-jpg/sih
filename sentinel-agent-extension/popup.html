<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SentinelAgent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <span class="app__mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5.5V11c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5.5L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 12.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div class="app__title">
        <span class="app__name">SentinelAgent</span>
        <span class="app__status" id="connectionStatus" data-state="idle">standing by</span>
      </div>
    </header>

    <main class="log" id="log" aria-live="polite">
      <div class="log__empty" id="logEmpty">
        Type a task below to start a run. Each pipeline stage will report here as it happens — nothing sensitive leaves this device unredacted.
      </div>
    </main>

    <form class="composer" id="composer">
      <input
        type="text"
        id="taskInput"
        class="composer__input"
        placeholder="Describe the task…"
        autocomplete="off"
      />
      <button type="submit" class="composer__send" id="sendButton" aria-label="Send task">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
