<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SentinelAgent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="app__brand">
        <span class="app__mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5.5V11c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5.5L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 12.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="app__title">
          <span class="app__name">SentinelAgent</span>
        </div>
      </div>
      <span class="app__status" id="connectionStatus" data-state="idle">ready</span>
    </header>

    <main class="log" id="log" aria-live="polite">
      <div class="log__empty" id="logEmpty">
        <div class="log__empty-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 13.8214 2.48697 15.5291 3.33782 17L2.5 21.5L7 20.6622C8.47087 21.513 10.1786 22 12 22Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        Ask a question (e.g. <em>"what do u see"</em>) or specify a browser task. All sensitive data is redacted on-device before reasoning.
      </div>
    </main>

    <div class="composer-wrapper">
      <form class="composer" id="composer">
        <input
          type="text"
          id="taskInput"
          class="composer__input"
          placeholder="Ask or give a browser task…"
          autocomplete="off"
        />
        <button type="submit" class="composer__send" id="sendButton" aria-label="Send task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <div class="composer__footer-note">🛡️ On-Device Privacy Redaction Active</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
