<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SentinelAgent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- 1. Top Header Bar -->
    <header class="app__header">
      <div class="app__brand">
        <div class="app__shield-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5.5V11c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5.5L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 12.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="app__header-titles">
          <span class="app__title">SentinelAgent</span>
        </div>
      </div>

      <div class="app__header-actions">
        <span class="app__status" id="connectionStatus" data-state="idle">ready</span>
        <button type="button" class="header-btn" id="newChatBtn" title="New task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="header-btn" id="telemetryToggle" title="View telemetry metrics" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Telemetry Metrics Panel -->
    <div class="telemetry-drawer" id="telemetryDrawer">
      <div class="telemetry-grid">
        <div class="telemetry-card">
          <span class="telemetry-card__label">📷 Screen Capture</span>
          <span class="telemetry-card__value" id="valCapture">-- ms</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">🔍 DOM Grounding</span>
          <span class="telemetry-card__value" id="valPerception">-- ms</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">🔒 Pixel Redaction</span>
          <span class="telemetry-card__value" id="valRedact">-- ms</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">📡 Cloud VLM</span>
          <span class="telemetry-card__value" id="valServer">-- ms</span>
        </div>
        <div class="telemetry-card telemetry-card--highlight">
          <span class="telemetry-card__label">⚡ Total Roundtrip</span>
          <span class="telemetry-card__value" id="valTotal">-- s</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">💾 Client Memory</span>
          <span class="telemetry-card__value" id="valMemory">-- MB</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">🛡️ Zero-Leakage</span>
          <span class="telemetry-card__value text-teal">100.0%</span>
        </div>
        <div class="telemetry-card">
          <span class="telemetry-card__label">🎯 Elements</span>
          <span class="telemetry-card__value" id="valElements">--</span>
        </div>
      </div>
    </div>

    <!-- 2. Main Content Area (Activity Feed) -->
    <main class="log" id="log" aria-live="polite">
      <div class="log__empty" id="logEmpty">
        <div class="log__watermark" aria-hidden="true">
          <svg width="84" height="84" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5.5V11c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5.5L12 2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M9 12.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="log__empty-hint">Type a task below to assist on this page.<br/>All sensitive data is redacted locally.</p>
      </div>
    </main>

    <!-- 4. Context Pill & 3. Bottom Floating Input Bar -->
    <div class="composer-container">
      <div class="context-pill" id="contextPill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span id="contextTitle">Current Tab</span>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="taskInput"
          class="composer__input"
          placeholder="Ask anything..."
          autocomplete="off"
        />

        <div class="composer__actions">
          <!-- Subtle icon buttons -->
          <button type="button" class="composer__tool-btn" title="Screen vision active" tabindex="-1">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v2M16 20h2a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>

          <!-- Solid Teal Send Button -->
          <button type="submit" class="composer__send" id="sendButton" aria-label="Send task">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
